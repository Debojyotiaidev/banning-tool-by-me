<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banning Tool - Sonics Prediction</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; color: #262626; margin: 0; }
      .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
      .card { background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
      .header { text-align: center; margin-bottom: 40px; }
      .input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
      input[type="text"] { padding: 10px; border: 1px solid #dbdbdb; border-radius: 4px; width: 300px; }
      button { padding: 10px 20px; background: #0095f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
      button:hover { background: #1877f2; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .risk-high { color: #ed4956; }
      .risk-medium { color: #f5a623; }
      .risk-low { color: #198754; }
      .simulator-box { background: #f8f9fa; border-left: 4px solid #0095f6; padding: 15px; }
      pre { white-space: pre-wrap; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
