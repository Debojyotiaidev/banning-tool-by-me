<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonics — Read-only Instagram Policy &amp; Evidence Analysis</title>
    <style>
      :root { --blue: #0095f6; --blue-dark: #1877f2; --border: #dbdbdb; --bg: #fafafa; --ink: #262626; }
      * { box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); margin: 0; }
      .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
      .header { text-align: center; margin-bottom: 32px; }
      .header h1 { color: var(--blue); margin-bottom: 6px; }
      .header p { color: #8e8e8e; margin: 0; }
      .input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
      input[type="text"], input[type="number"] { padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
      input[type="text"] { width: 320px; }
      input[type="number"] { width: 100%; margin-bottom: 8px; }
      button { padding: 10px 20px; background: var(--blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
      button:hover { background: var(--blue-dark); }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .dark-btn { background: var(--ink); margin-top: 4px; }
      .dark-btn:hover { background: #000; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
      .risk-high { color: #ed4956; font-weight: bold; }
      .risk-medium { color: #f5a623; font-weight: bold; }
      .risk-low { color: #198754; font-weight: bold; }
      .status-badge { font-weight: bold; color: var(--blue); }
      .simulator-box { background: #f8f9fa; border-left: 4px solid var(--blue); }
      .disclaimer { color: #8e8e8e; font-size: 13px; }
      .private-note { color: #f5a623; font-size: 13px; }
      .summary-text { font-size: 14px; }
      .error-banner { background: #fdecea; border: 1px solid #f5c6cb; color: #c0392b; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; text-align: center; }
      .analysis-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 6px; }
      .analysis-item { min-width: 220px; border: 1px solid #eee; border-radius: 6px; padding: 12px; background: #fff; }
      .analysis-item h4 { margin: 0 0 8px; color: var(--blue); }
      .analysis-item p { margin: 4px 0; font-size: 13px; }
      .evidence { background: #f8f9fa; border-radius: 4px; padding: 6px; font-size: 12px; }
      .explanation { color: #555; font-size: 12px; }
      .sim-result { text-align: center; border: 2px solid var(--blue); border-radius: 8px; padding: 16px; background: #fff; }
      .sim-number { font-size: 52px; margin: 8px 0; color: var(--blue); }
      .factor-list { text-align: left; font-size: 14px; }
      .factor-list ul { margin: 4px 0 0; padding-left: 20px; }
      .sim-placeholder { border: 1px dashed var(--border); border-radius: 8px; padding: 40px 20px; text-align: center; color: #8e8e8e; }
      .scenario { font-size: 12px; color: #555; text-align: left; }
      pre { white-space: pre-wrap; font-size: 12px; }
    </style>
    <script type="module" crossorigin src="/assets/index-C9d4gZs4.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
