[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonics-analyzer"
version = "1.0.0"
description = "Read-only Instagram AI account analyzer and hypothetical enforcement-prediction simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "instaloader",
    "httpx",
    "transformers",
    "torch",
    "google-generativeai"
]

[project.scripts]
sonics = "app.main:main"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = [
    "app",
    "app.agents",
    "app.agents.providers",
    "app.api",
    "app.instagram",
    "app.models",
    "app.simulation",
]
